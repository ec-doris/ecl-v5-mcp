[project]
name = "ecl-v5-mcp"
version = "5.3.1"
description = "HTTP (FastMCP) MCP server for ECL V5 components and guides"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.10",
    "uvicorn>=0.54.0",
]

[project.scripts]
ecl-v5-mcp-http = "ecl_v5_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecl_v5_mcp"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]
