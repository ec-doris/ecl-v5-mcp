<!-- Default EC carousel: Embla controls, teaser navigation, banner slides and counter. -->
<section
  class="ecl-carousel"
  data-ecl-auto-init="Carousel"
  aria-roledescription="carousel"
  aria-label="Featured highlights"
  data-ecl-carousel-counter-label="of"
>
  <div class="ecl-carousel__controls">
    <div class="ecl-container">
      <div class="ecl-carousel__navigation">
        <div class="ecl-carousel__pager-container">
          <div class="ecl-slider-pager ecl-carousel__pager">
            <button
              class="ecl-button ecl-button--secondary ecl-button--m ecl-button--neutral ecl-slider-pager__play ecl-carousel__play ecl-button--icon-only"
              type="button"
            >
              <span class="ecl-button__container">
                <span class="ecl-button__label" data-ecl-label="true"
                  >Play</span
                >
                <span
                  aria-hidden="true"
                  class="wt-icon-phosphor--play-filled ecl-icon ecl-icon--m ecl-button__icon ecl-icon-phosphor--play-filled"
                  data-ecl-icon
                ></span>
              </span>
            </button>
            <button
              class="ecl-button ecl-button--secondary ecl-button--m ecl-button--neutral ecl-slider-pager__pause ecl-carousel__pause ecl-button--icon-only"
              type="button"
            >
              <span class="ecl-button__container">
                <span class="ecl-button__label" data-ecl-label="true"
                  >Pause</span
                >
                <span
                  aria-hidden="true"
                  class="wt-icon-phosphor--pause-filled ecl-icon ecl-icon--m ecl-button__icon ecl-icon-phosphor--pause-filled"
                  data-ecl-icon
                ></span>
              </span>
            </button>
            <button
              class="ecl-button ecl-button--tertiary ecl-button--m ecl-button--neutral ecl-slider-pager__prev ecl-carousel__prev ecl-button--icon-only"
              type="button"
            >
              <span class="ecl-button__container">
                <span class="ecl-button__label" data-ecl-label="true"
                  >Previous</span
                >
                <span
                  aria-hidden="true"
                  class="wt-icon-phosphor--caret-left wt-icon--monochrome ecl-icon ecl-icon--m ecl-button__icon ecl-icon-phosphor--caret-left"
                  data-ecl-icon
                ></span>
              </span>
            </button>
            <div class="ecl-slider-pager__dots ecl-carousel__dots"></div>
            <button
              class="ecl-button ecl-button--tertiary ecl-button--m ecl-button--neutral ecl-slider-pager__next ecl-carousel__next ecl-button--icon-only"
              type="button"
            >
              <span class="ecl-button__container">
                <span class="ecl-button__label" data-ecl-label="true"
                  >Next</span
                >
                <span
                  aria-hidden="true"
                  class="wt-icon-phosphor--caret-right wt-icon--monochrome ecl-icon ecl-icon--m ecl-button__icon ecl-icon-phosphor--caret-right"
                  data-ecl-icon
                ></span>
              </span>
            </button>
            <script
              type="text/template"
              data-ecl-slider-dot-template
              data-ecl-carousel-dot-template
            >
              <button class="ecl-slider-pager__dot ecl-carousel__dot"></button>
            </script>
          </div>
          <div class="ecl-carousel__counter" dir="ltr"></div>
        </div>
        <div class="ecl-carousel__teasers" role="tablist">
          <button
            class="ecl-carousel__teaser-button"
            type="button"
            data-ecl-carousel-teaser-button
            data-ecl-carousel-slide-index="0"
            role="tab"
            tabindex="-1"
          >
            <span class="ecl-carousel__teaser-loading-bar" aria-hidden="true">
              <span class="ecl-carousel__teaser-loading-bar-completion"></span>
            </span>
            <span class="ecl-carousel__teaser-content">
              <span class="ecl-carousel__teaser-title"
                >Jobs and opportunities</span
              >
            </span>
          </button>
          <button
            class="ecl-carousel__teaser-button"
            type="button"
            data-ecl-carousel-teaser-button
            data-ecl-carousel-slide-index="1"
            role="tab"
            tabindex="-1"
          >
            <span class="ecl-carousel__teaser-loading-bar" aria-hidden="true">
              <span class="ecl-carousel__teaser-loading-bar-completion"></span>
            </span>
            <span class="ecl-carousel__teaser-content">
              <span class="ecl-carousel__teaser-title"
                >Green transition</span
              >
            </span>
          </button>
          <button
            class="ecl-carousel__teaser-button"
            type="button"
            data-ecl-carousel-teaser-button
            data-ecl-carousel-slide-index="2"
            role="tab"
            tabindex="-1"
          >
            <span class="ecl-carousel__teaser-loading-bar" aria-hidden="true">
              <span class="ecl-carousel__teaser-loading-bar-completion"></span>
            </span>
            <span class="ecl-carousel__teaser-description"
              >A message from Europe</span
            >
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="ecl-carousel__viewport">
    <div class="ecl-carousel__slides">
      <div
        class="ecl-carousel__slide"
        role="tabpanel"
        aria-label="slide 1 of 3"
        aria-roledescription="slide"
      >
        <section
          class="ecl-banner ecl-banner--m ecl-banner--font-m ecl-banner--font-weight-light ecl-banner--box-bg-light ecl-banner--color-dark ecl-banner--h-left ecl-banner--v-center"
          data-ecl-auto-init="Banner"
          data-ecl-banner
          id="carousel-example-1"
        >
          <figure class="ecl-banner__picture-container">
            <picture
              class="ecl-picture ecl-banner__picture"
              data-ecl-banner-image
            >
              <img
                class="ecl-banner__image"
                src="https://inno-ecl.s3.amazonaws.com/media/examples/example-image.jpg"
                alt="A European Commission programme"
              />
            </picture>
          </figure>
          <div class="ecl-container ecl-banner__info">
            <div class="ecl-banner__container" data-ecl-banner-container>
              <div class="ecl-banner__content">
                <div class="ecl-banner__title" id="carousel-example-1-title">
                  <span class="ecl-banner__title-text"
                    >Jobs and opportunities</span
                  >
                </div>
                <p
                  class="ecl-banner__description"
                  id="carousel-example-1-description"
                >
                  <span class="ecl-banner__description-text"
                    >Discover opportunities across the EU institutions.</span
                  >
                </p>
                <div class="ecl-banner__cta">
                  <a
                    class="ecl-link ecl-link--primary-highlight ecl-link--icon ecl-banner__link-cta"
                    href="/example"
                    aria-describedby="carousel-example-1-title"
                  >
                    <span class="ecl-link__label">Learn more</span>
                    <span
                      aria-hidden="true"
                      class="wt-icon--corner-arrow ecl-icon ecl-icon--xs ecl-icon--rotate-90 ecl-link__icon ecl-icon--corner-arrow"
                      data-ecl-icon
                    ></span>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
      <div
        class="ecl-carousel__slide"
        role="tabpanel"
        aria-label="slide 2 of 3"
        aria-roledescription="slide"
        inert="true"
      >
        <section
          class="ecl-banner ecl-banner--m ecl-banner--font-m ecl-banner--font-weight-light ecl-banner--box-bg-dark ecl-banner--color-light ecl-banner--h-left ecl-banner--v-center"
          data-ecl-auto-init="Banner"
          data-ecl-banner
          id="carousel-example-2"
        >
          <figure class="ecl-banner__picture-container">
            <picture
              class="ecl-picture ecl-banner__picture"
              data-ecl-banner-image
            >
              <img
                class="ecl-banner__image"
                src="https://inno-ecl.s3.amazonaws.com/media/examples/example-image2.jpg"
                alt="A community energy project"
              />
            </picture>
            <footer class="ecl-banner__credit" data-ecl-banner-footer>
              <div class="ecl-container">Photo: European Commission</div>
            </footer>
          </figure>
          <div class="ecl-container ecl-banner__info">
            <div class="ecl-banner__container" data-ecl-banner-container>
              <div class="ecl-banner__content">
                <div class="ecl-banner__title" id="carousel-example-2-title">
                  <span class="ecl-banner__title-text"
                    >Green transition</span
                  >
                </div>
                <div class="ecl-banner__cta">
                  <a
                    class="ecl-link ecl-link--primary-highlight-inverted ecl-link--icon ecl-banner__link-cta"
                    href="/example"
                    aria-describedby="carousel-example-2-title"
                  >
                    <span class="ecl-link__label">Explore</span>
                    <span
                      aria-hidden="true"
                      class="wt-icon--corner-arrow ecl-icon ecl-icon--xs ecl-icon--rotate-90 ecl-link__icon ecl-icon--corner-arrow"
                      data-ecl-icon
                    ></span>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
      <div
        class="ecl-carousel__slide"
        role="tabpanel"
        aria-label="slide 3 of 3"
        aria-roledescription="slide"
        inert="true"
      >
        <section
          class="ecl-banner ecl-banner--m ecl-banner--font-m ecl-banner--font-weight-light ecl-banner--box-bg-dark ecl-banner--color-light ecl-banner--h-left ecl-banner--v-center"
          data-ecl-auto-init="Banner"
          data-ecl-banner
          id="carousel-example-3"
        >
          <div class="ecl-banner__video-container">
            <video
              class="ecl-video ecl-banner__video"
              data-ecl-banner-video
              muted
              playsinline
              preload="metadata"
              poster="https://vod.prd.commavservices.eu/12/224712/THUMB_I224712EN1W_V_1.jpg"
            >
              <source
                src="https://vod.prd.commavservices.eu/01/275521/019813ec-13ce-7136-ac0d-d7e24fec64c0/1080p-qaa.mp4"
                type="video/mp4"
              />
            </video>
            <button
              class="ecl-button ecl-button--tertiary ecl-button--m ecl-button--neutral ecl-banner__play ecl-button--icon-only"
              data-ecl-banner-play
              type="button"
            >
              <span class="ecl-button__container">
                <span class="ecl-button__label" data-ecl-label="true"
                  >Play video</span
                >
                <span
                  aria-hidden="true"
                  class="wt-icon--play-outline ecl-icon ecl-icon--m ecl-button__icon ecl-icon--play-outline"
                  data-ecl-icon
                ></span>
              </span>
            </button>
            <button
              class="ecl-button ecl-button--tertiary ecl-button--m ecl-button--neutral ecl-banner__pause ecl-button--icon-only"
              data-ecl-banner-pause
              type="button"
            >
              <span class="ecl-button__container">
                <span class="ecl-button__label" data-ecl-label="true"
                  >Pause video</span
                >
                <span
                  aria-hidden="true"
                  class="wt-icon--pause-outline ecl-icon ecl-icon--m ecl-button__icon ecl-icon--pause-outline"
                  data-ecl-icon
                ></span>
              </span>
            </button>
          </div>
          <div class="ecl-container ecl-banner__info">
            <div class="ecl-banner__container" data-ecl-banner-container>
              <div class="ecl-banner__content">
                <div class="ecl-banner__title" id="carousel-example-3-title">
                  <span class="ecl-banner__title-text">A message from Europe</span>
                </div>
                <p
                  class="ecl-banner__description"
                  id="carousel-example-3-description"
                >
                  <span class="ecl-banner__description-text"
                    >Hear the latest news from the European Commission.</span
                  >
                </p>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>
</section>

              >

        </div>
      </div>
    </div>
    <div class="ecl-carousel__viewport">
      <div class="ecl-carousel__slides">
        <div
          class="ecl-carousel__slide"
          role="tabpanel"
          aria-label="slide 1 of 1"
          aria-roledescription="slide"
        >
          <section
            class="ecl-banner ecl-banner--m ecl-banner--font-m ecl-banner--font-weight-light ecl-banner--box-bg-light ecl-banner--color-dark ecl-banner--h-left ecl-banner--v-center"
