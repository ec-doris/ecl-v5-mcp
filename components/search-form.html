<!-- Search form: the form wrapper intentionally has no duplicate role=search. -->
<h3 class="ecl-u-type-heading-3">Search Form</h3>
<div class="ecl-u-mb-l">
  <form class="ecl-search-form">
    <div class="ecl-form-group">
      <label class="ecl-form-label-wrapper ecl-search-form__label" for="search-input-id" id="search-input-id-label">
        <span class="ecl-form-label">Search</span>
      </label>
      <input
        class="ecl-text-input ecl-text-input--m ecl-search-form__text-input"
        id="search-input-id"
        placeholder="Placeholder text"
        type="search"
      />
    </div>
    <button
      class="ecl-button ecl-button--tertiary ecl-button--neutral ecl-search-form__button ecl-button--icon-only"
      type="submit"
    >
      <span class="ecl-button__container">
        <span
          aria-hidden="true"
          class="wt-icon--search ecl-icon ecl-icon--m ecl-button__icon ecl-icon--search"
          data-ecl-icon
        ></span>
        <span class="ecl-button__label" data-ecl-label="true">Search</span>
      </span>
    </button>
  </form>
</div>

<!-- Extension attributes, extra classes and extra form content -->
<h3 class="ecl-u-type-heading-3">Search Form With Extension Hooks</h3>
<div class="ecl-u-mb-l">
  <form
    class="ecl-search-form custom-class custom-class--test"
    data-test="data-test-value"
    data-test-flag
  >
    <div class="ecl-form-group">
      <label class="ecl-form-label-wrapper ecl-search-form__label" for="search-input-hooks" id="search-input-hooks-label">
        <span class="ecl-form-label">Search</span>
      </label>
      <input
        class="ecl-text-input ecl-text-input--m ecl-search-form__text-input input-extra-class"
        id="search-input-hooks"
        name="search"
        placeholder="Placeholder text"
        type="search"
      />
    </div>
    <button
      class="ecl-button ecl-button--tertiary ecl-button--neutral ecl-search-form__button button-extra-class ecl-button--icon-only"
      type="submit"
    >
      <span class="ecl-button__container">
        <span aria-hidden="true" class="wt-icon--search ecl-icon ecl-icon--m ecl-button__icon ecl-icon--search" data-ecl-icon></span>
        <span class="ecl-button__label" data-ecl-label="true">Search</span>
      </span>
    </button>
    <input id="custId" name="custId" type="hidden" value="1" />
  </form>
</div>
