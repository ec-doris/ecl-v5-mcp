<!-- Default EC highlighted search: labelled search form, helper text and suggestions. -->
<div class="ecl-container">
  <div class="ecl-highlighted-search ecl-color-mode--default">
    <div class="ecl-highlighted-search__content">
      <div class="ecl-highlighted-search__title" id="highlighted-search-title">
        Find your next role
      </div>
      <div class="ecl-highlighted-search__description ecl-content-color">
        Discover job opportunities in the EU institutions
      </div>
      <form
        class="ecl-highlighted-search__form"
        role="search"
        aria-labelledby="highlighted-search-title"
        method="GET"
        action="/example"
      >
        <div class="ecl-highlighted-search__form-content">
          <span
            aria-hidden="true"
            class="wt-icon-phosphor--magnifying-glass ecl-icon ecl-icon--m ecl-highlighted-search__form-icon ecl-icon-phosphor--magnifying-glass"
            data-ecl-icon
          ></span>
          <div class="ecl-form-group ecl-highlighted-search__form-group">
            <label
              class="ecl-form-label-wrapper"
              for="highlighted-search-input-id"
              id="highlighted-search-input-id-label"
            >
              <span class="ecl-form-label ecl-form-label--hidden">Search</span>
            </label>
            <input
              class="ecl-text-input ecl-text-input--l ecl-highlighted-search__form-input"
              id="highlighted-search-input-id"
              name="highlighted-search-input-name"
              type="search"
              aria-describedby="highlighted-search-helper"
            />
          </div>
          <button
            class="ecl-button ecl-button--primary ecl-button--m ecl-button--highlight ecl-highlighted-search__form-button"
            type="submit"
          >
            Search
          </button>
        </div>
        <div
          class="ecl-highlighted-search__form-helper"
          id="highlighted-search-helper"
        >
          e.g. full time, designer, writer
        </div>
      </form>
      <div class="ecl-highlighted-search__suggestion">
        <span
          class="ecl-highlighted-search__suggestion-label"
          id="highlighted-search-suggestion-label"
        >
          Or explore:
        </span>
        <ul
          class="ecl-tag-set ecl-highlighted-search__suggestion-list"
          aria-labelledby="highlighted-search-suggestion-label"
        >
          <li class="ecl-tag-set__item">
            <a class="ecl-tag" href="/example">Traineeships</a>
          </li>
          <li class="ecl-tag-set__item">
            <a class="ecl-tag" href="/example">IT &amp; Digital</a>
          </li>
          <li class="ecl-tag-set__item">
            <a class="ecl-tag" href="/example">Policy &amp; Law</a>
          </li>
          <li class="ecl-tag-set__item">
            <a class="ecl-tag" href="/example">Translation</a>
          </li>
          <li class="ecl-tag-set__item">
            <a class="ecl-tag" href="/example">Communication</a>
          </li>
          <li class="ecl-tag-set__item">
            <a class="ecl-tag" href="/example">Finance &amp; Economics</a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>

<!-- Search without suggestions: the form contract also supports a custom action. -->
<div class="ecl-container ecl-u-mt-2xl">
  <div class="ecl-highlighted-search ecl-color-mode--blue">
    <div class="ecl-highlighted-search__content">
      <div class="ecl-highlighted-search__title" id="highlighted-search-simple-title">
        Search EU legislation
      </div>
      <form
        class="ecl-highlighted-search__form"
        role="search"
        aria-labelledby="highlighted-search-simple-title"
        method="POST"
        action="/search"
      >
        <div class="ecl-highlighted-search__form-content">
          <span
            aria-hidden="true"
            class="wt-icon-phosphor--magnifying-glass ecl-icon ecl-icon--m ecl-highlighted-search__form-icon ecl-icon-phosphor--magnifying-glass"
            data-ecl-icon
          ></span>
          <div class="ecl-form-group ecl-highlighted-search__form-group">
            <label
              class="ecl-form-label-wrapper"
              for="highlighted-search-simple-input"
              id="highlighted-search-simple-input-label"
            >
              <span class="ecl-form-label ecl-form-label--hidden">Search</span>
            </label>
            <input
              class="ecl-text-input ecl-text-input--l ecl-highlighted-search__form-input"
              id="highlighted-search-simple-input"
              name="query"
              type="search"
            />
          </div>
          <button
            class="ecl-button ecl-button--primary ecl-button--m ecl-button--highlight ecl-highlighted-search__form-button"
            type="submit"
          >
            Search
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
